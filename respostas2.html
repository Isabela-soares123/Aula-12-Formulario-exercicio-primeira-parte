<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        background:#fff;
    }

    .container{
        width:400px;
    }

    h1{
        text-align:center;
        margin-bottom:40px;
        font-size:48px;
        color:#333;
    }

    .form-group{
        margin-bottom:25px;
    }

    label{
        display:block;
        margin-bottom:10px;
        font-size:24px;
        font-weight:bold;
        color:#333;
    }

    input{
        width:100%;
        padding:15px;
        border:1px solid #ddd;
        border-radius:10px;
        font-size:18px;
        outline:none;
    }

    button{
        width:100%;
        padding:15px;
        background:#1e88e5;
        color:white;
        border:none;
        border-radius:10px;
        font-size:20px;
        font-weight:bold;
        cursor:pointer;
        margin-top:10px;
    }

    button:hover{
        background:#1976d2;
    }

    .login{
        text-align:center;
        margin-top:25px;
        font-size:18px;
        color:#777;
    }

    .login a{
        text-decoration:none;
        color:#1e88e5;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Cadastro</h1>

    <form>
        <div class="form-group">
            <label>Nome completo</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>E-mail</label>
            <input type="email">
        </div>

        <div class="form-group">
            <label>Senha</label>
            <input type="password">
        </div>

        <button type="submit">Cadastrar</button>
    </form>

    <p class="login">
        Já possui uma conta?
        <a href="#">Entrar</a>
    </p>
</div>

</body>
</html>
